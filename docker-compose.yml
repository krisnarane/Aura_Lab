services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aura_lab
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - aura_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura_lab"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  aura_postgres:
