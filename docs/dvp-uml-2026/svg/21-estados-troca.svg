cx="90.5" cy="528.0986" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="22" data-uid="ent0003" id="entity_GMN2"><path d="M166,369.0986 L166,418.5986 L135.91,422.5986 L166,426.5986 L166,475.6904 A0,0 0 0 0 166,475.6904 L515.4121,475.6904 A0,0 0 0 0 515.4121,475.6904 L515.4121,379.0986 L505.4121,369.0986 L166,369.0986 A0,0 0 0 0 166,369.0986" fill="#EDF5F2" style="stroke:#181818;stroke-width:0.5;"/><path d="M505.4121,369.0986 L505.4121,379.0986 L515.4121,379.0986 L505.4121,369.0986" fill="#EDF5F2" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="328.4121" x="172" y="387.2305">Cupom, reentrada opcional e auditoria s&#227;o at&#244;micos.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="273.1777" x="172" y="403.3291">Repeti&#231;&#227;o n&#227;o duplica cr&#233;dito nem estoque.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="273.123" x="172" y="419.4277">Cr&#233;dito usa valor l&#237;quido hist&#243;rico sem frete.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="296.4814" x="172" y="435.5264">Compras integrais acompanham estes estados.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="322.1914" x="172" y="451.625">Recebimento ap&#243;s autoriza&#231;&#227;o e pol&#237;tica de cr&#233;dito:</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="322.9639" x="172" y="467.7236">comunica&#231;&#227;o e valida&#231;&#227;o com professor pendentes.</text></g><!--link *start* to EM_TROCA--><g class="link" data-entity-1=".start." data-entity-2="EM_TROCA" data-source-line="17" data-uid="lnk4" id="link_.start._EM_TROCA"><path d="M90.5,63.1586 C90.5,76.4686 90.5,95.7686 90.5,114.7586" fill="no